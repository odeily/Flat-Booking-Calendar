name: app_alquiler_jefe
description: "Channel Manager móvil y gestor multipropiedad con sincronización bidireccional iCal (RFC 5545) para Airbnb y Booking.com."
publish_to: 'none'

version: 1.1.2+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/POLITICA_PRIVACIDAD.md
    - assets/TERMINOS_SERVICIO.md
    - assets/logo.jpg
